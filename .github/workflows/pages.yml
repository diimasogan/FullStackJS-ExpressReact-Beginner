name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend-react/package-lock.json
      - name: Install
        working-directory: frontend-react
        run: npm ci
      - name: Build demo (backend simulated in the browser)
        working-directory: frontend-react
        env:
          VITE_DEMO: "true"
          VITE_BASE: /FullStackJS-ExpressReact-Beginner/
        run: npm run build
      - name: Add SPA fallback and documentation
        run: |
          cp frontend-react/dist/index.html frontend-react/dist/404.html
          mkdir -p frontend-react/dist/docs/id
          cp docs/*.html frontend-react/dist/docs/
          cp docs/id/*.html frontend-react/dist/docs/id/
          touch frontend-react/dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend-react/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
